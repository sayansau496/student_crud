{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h2>{{ title }}</h2>

{# The same form is used for Add and Edit. For Add, "student" is empty. #}
<form method="post" class="student-form">
    <label for="roll_no">Roll Number</label>
    <input type="number" id="roll_no" name="roll_no" min="1"
           value="{{ student.roll_no if student else '' }}" required>

    <label for="name">Student Name</label>
    <input type="text" id="name" name="name" maxlength="50"
           value="{{ student.name if student else '' }}" required>

    <label for="section">Section</label>
    <input type="text" id="section" name="section" maxlength="1"
           value="{{ student.section if student else '' }}" required>

    <label for="stream">Stream</label>
    <select id="stream" name="stream" required>
        <option value="">-- Choose stream --</option>
        {% for st in streams %}
            <option value="{{ st }}" {% if student and student.stream == st %}selected{% endif %}>{{ st }}</option>
        {% endfor %}
    </select>

    <label for="marks">Marks (out of 100)</label>
    <input type="number" id="marks" name="marks" min="0" max="100"
           value="{{ student.marks if student else '' }}" required>

    <div class="form-buttons">
        <button type="submit" class="btn btn-green">Save</button>
        <a href="{{ url_for('index') }}" class="btn btn-grey">Cancel</a>
    </div>
</form>
{% endblock %}
